# Publica la web en Firebase Hosting (canal "live") con cada push a main.
name: Deploy a Firebase Hosting (producción)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID_STUDIO_53F5A }}
          projectId: id-studio-53f5a
          channelId: live
